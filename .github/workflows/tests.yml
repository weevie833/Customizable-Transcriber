name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is the documented floor (pyproject.toml's requires-python) --
        # google-genai, anthropic, and rapidfuzz all need it, higher than
        # the 3.9 this used to claim. Also covers 3.12 so the matrix isn't
        # only ever testing the oldest supported version.
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for the offline baptism-parser.js regression suite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest suite (tests/)
        run: python -m pytest tests/ -v

      - name: Run offline parser regression suite (xls_conversion/tests/)
        run: python xls_conversion/tests/run_parser_test.py
