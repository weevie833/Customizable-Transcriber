name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Also run weekly on main even with no code changes -- a dependency
  # already pinned and unchanged can still get a new CVE disclosed against
  # it (this is exactly how the pytest==8.3.4 / PYSEC-2026-1845 finding
  # happened: nothing in this repo changed, the advisory was just
  # published later). A push/PR-only trigger would never catch that.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is the documented floor (pyproject.toml's requires-python) --
        # google-genai, anthropic, and rapidfuzz all need it, higher than
        # the 3.9 this used to claim. Also covers 3.12 so the matrix isn't
        # only ever testing the oldest supported version.
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for the offline baptism-parser.js regression suite)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest suite (tests/)
        run: python -m pytest tests/ -v

      - name: Run offline parser regression suite (xls_conversion/tests/)
        run: python xls_conversion/tests/run_parser_test.py

  # Informational only (continue-on-error: true below) -- reports Ruff's
  # default findings on every push/PR without failing the build. Added per
  # CODEX_REVIEW.md finding L-8 / HUMAN_DECISIONS.md, specifically to catch
  # the kind of drift (20 unused imports had accumulated unnoticed) an
  # earlier review found by running Ruff manually. One run is enough, same
  # reasoning as dependency-audit below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (ruff is pinned in requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff (does not fail the build -- see this job's own comment)
        continue-on-error: true
        run: python -m ruff check .

  # Automates the two manual checks a follow-up code review did
  # by hand ("Runtime Python dependency audit", "Worksheet npm dependency
  # audit"). One run is enough (unlike the `test` job
  # above, this doesn't depend on OS or Python version), and it runs on the
  # weekly schedule too, not just push/PR -- see the top-level comment on
  # `schedule:`.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pip-audit is pinned in requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies (requirements.txt + requirements-dev.txt)
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Audit worksheet-builder npm dependencies (profiles/worksheets/)
        working-directory: profiles/worksheets
        run: |
          npm ci
          npm audit --audit-level=high
