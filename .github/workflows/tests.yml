name: Tests

# Actions minutes are the constraint on a private free-tier repo (2,000/month;
# macOS bills 10x, Windows 2x -- one full three-OS run costs ~50 billed
# minutes). So a normal push/PR runs only the cheap Linux matrix, and the
# full cross-platform matrix runs weekly, on demand (workflow_dispatch:
# Actions tab -> Tests -> Run workflow), and on version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes can't break tests.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
  # Also run weekly on main even with no code changes -- a dependency
  # already pinned and unchanged can still get a new CVE disclosed against
  # it (this is exactly how the pytest==8.3.4 / PYSEC-2026-1845 finding
  # happened: nothing in this repo changed, the advisory was just
  # published later). A push/PR-only trigger would never catch that.
  schedule:
    - cron: "17 6 * * 1"

# A newer push to the same branch cancels the still-running older run (never
# a scheduled run, which has no "newer" version of itself to defer to).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Every push/PR: Linux only (1x billing). 3.11 is the documented floor
  # (pyproject.toml's requires-python) -- Pillow 13 needs it -- and 3.12 is
  # the newer version we also support.
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for the offline baptism-parser.js regression suite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest suite (tests/)
        run: python -m pytest tests/ -v

      - name: Run offline parser regression suite (xls_conversion/tests/)
        run: python xls_conversion/tests/run_parser_test.py

  # Weekly / manual / version-tag only (see the top-level comment): Windows and
  # macOS, where path handling, native file dialogs' subprocess calls and
  # line endings can differ. macOS runs one Python version only -- it is the
  # expensive one (10x).
  test-cross-platform:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (for the offline baptism-parser.js regression suite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest suite (tests/)
        run: python -m pytest tests/ -v

      - name: Run offline parser regression suite (xls_conversion/tests/)
        run: python xls_conversion/tests/run_parser_test.py

  # The only place the Windows double-click installer really runs. Same
  # schedule as test-cross-platform (Windows bills 2x). No setup-python: the
  # installer downloads Python itself, as it does for a user.
  windows-install:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CT_INSTALL_ONLY: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install with the double-click file
        shell: cmd
        run: call "Start Customizable Transcriber.bat"

      - name: Start the app with the installed runtime
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\Customizable Transcriber\Runtime\venv\Scripts\python.exe"
          $server = Start-Process $py -ArgumentList "launch.py","--no-browser" -PassThru
          $up = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          Stop-Process -Id $server.Id -Force
          if (-not $up) { throw "The app didn't answer on http://127.0.0.1:8765/" }

      - name: Run the suite with the installed runtime
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\Customizable Transcriber\Runtime\venv\Scripts\python.exe"
          & $py -m pip install --quiet -r requirements-dev.txt
          & $py -m pytest tests/ -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # The macOS double-click installer, on an Apple silicon runner (macos-latest).
  # macOS bills 10x, so same schedule as windows-install. Install only, then the
  # app must answer from the runtime the installer made.
  mac-install:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CT_INSTALL_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install with the double-click file
        run: ./"Start Customizable Transcriber.command"

      - name: Start the app with the installed runtime
        run: |
          py="$HOME/Library/Application Support/Customizable Transcriber/Runtime/venv/bin/python"
          "$py" launch.py --no-browser &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8765/ && up=1 && break; sleep 2; done
          kill %1
          [ -n "$up" ] || { echo "The app didn't answer on http://127.0.0.1:8765/"; exit 1; }

  # Informational only (continue-on-error: true below) -- reports Ruff's
  # default findings on every push/PR without failing the build. Added per
  # CODEX_REVIEW.md finding L-8 / HUMAN_DECISIONS.md, specifically to catch
  # the kind of drift (20 unused imports had accumulated unnoticed) an
  # earlier review found by running Ruff manually. One run is enough, same
  # reasoning as dependency-audit below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (ruff is pinned in requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff (does not fail the build -- see this job's own comment)
        continue-on-error: true
        run: python -m ruff check .

  # Automates the two manual checks a follow-up code review did
  # by hand ("Runtime Python dependency audit", "Worksheet npm dependency
  # audit"). One run is enough (unlike the `test` job
  # above, this doesn't depend on OS or Python version), and it runs on the
  # weekly schedule too, not just push/PR -- see the top-level comment on
  # `schedule:`.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pip-audit is pinned in requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies (requirements.lock = everything an install gets, + requirements-dev.txt)
        run: python -m pip_audit -r requirements.lock -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit worksheet-builder npm dependencies (profiles/worksheets/)
        working-directory: profiles/worksheets
        run: |
          npm ci
          npm audit --audit-level=high
