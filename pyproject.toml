[project]
name = "customizable-transcriber"
version = "0.5.0"
description = "Local web app that sends archival page images to Gemini or Claude, writes a plain-text transcription, and exports .docx; a separate XLS Conversion tool turns that text into a spreadsheet."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Pinned/floored dependency versions live in requirements.txt, not here --
# this app is run in place (`python3 app.py`), never built or installed as a
# package, so requirements.txt (already read by "pip install -r
# requirements.txt" in README's Setup section) stays the single source of
# truth for what to install. This file exists so tooling (pip, IDEs, CI) has
# a formal `requires-python` floor to check against, and so the project has
# one declared identity/version instead of only the bare VERSION file app.py
# reads at runtime for its footer.

[tool.pytest.ini_options]
testpaths = ["tests"]

# Informational only -- see .github/workflows/tests.yml's `lint` job
# (continue-on-error: true, never fails the build). Added per
# CODEX_REVIEW.md finding L-8 / HUMAN_DECISIONS.md: a prior review found 20
# unused imports that had drifted in unnoticed; this surfaces that class of
# drift in every PR's CI output without imposing a zero-findings bar on a
# codebase that hasn't been tuned against a linter before. No `select`/
# `ignore` customization deliberately -- Ruff's own default rule set
# (pyflakes + a slice of pycodestyle) is enough to catch the drift this was
# added for; narrowing or widening it is a separate decision for whoever
# starts actually acting on its output.
[tool.ruff]
target-version = "py310"
line-length = 120
